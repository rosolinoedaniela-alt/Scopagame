<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostica bot Scopa di prova</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09271d;color:#f7edcf;font:16px system-ui;padding:20px;box-sizing:border-box}
main{width:min(100%,440px);background:#12392b;border:1px solid #c9a85c;border-radius:18px;padding:24px;box-sizing:border-box}
h1{font-size:22px}p{line-height:1.5;color:#e7dfc7}
input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;font:inherit;margin-top:12px}
input{background:#071d16;color:white;border:1px solid #8d7849}
button{background:#c9a85c;color:#17251c;border:0;font-weight:700}
#status{overflow-wrap:anywhere;margin-top:16px}
</style>
<main>
<h1>♠ Diagnostica Scopa di prova</h1>
<p>Inserisci il valore di <b>SCOPA_STAGING_WEBHOOK_SECRET</b> già salvato nei Secrets Supabase. Questa verifica legge getMe e getWebhookInfo: non modifica il webhook e non mostra il token.</p>
<input id="secret" type="password" autocomplete="off" placeholder="Secret webhook staging">
<button id="go">Diagnostica Telegram</button>
<button id="register" type="button">Configura webhook di prova</button>
<p id="status" role="status"></p>
</main>
<script>
const endpoint="https://sommziqnmxgkwyjatxcn.supabase.co/functions/v1/scopa-telegram-staging";
document.getElementById("go").addEventListener("click",async()=>{
 const secret=document.getElementById("secret").value;
 const status=document.getElementById("status");
 if(!secret){status.textContent="Inserisci il secret.";return;}
 status.textContent="Verifica comunicazione con Telegram…";
 try{
  const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"diagnostics",setupSecret:secret})});
  const j=await r.json();
  status.textContent=r.ok&&j.ok?"Diagnostica completata: "+JSON.stringify(j.diagnostics):"Errore: "+(j.error||j.message||"controlla il secret e i Secrets Supabase.");
  
 }catch(e){status.textContent="Errore di rete. Riprova tra poco.";}
});
document.getElementById("register").addEventListener("click",async()=>{
 const secret=document.getElementById("secret").value;
 const status=document.getElementById("status");
 if(!secret){status.textContent="Inserisci il secret.";return;}
 status.textContent="Configurazione webhook di prova in corso…";
 try{
  const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"registerWebhook",setupSecret:secret})});
  const j=await r.json();
  if(!r.ok||!j.ok){status.textContent="Errore configurazione: "+(j.error||j.message||"richiesta non riuscita");return;}
  status.textContent="Webhook registrato. Verifico la configurazione…";
  const v=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"diagnostics",setupSecret:secret})});
  const d=await v.json();
  status.textContent=v.ok&&d.ok?"Configurazione verificata: "+JSON.stringify(d.diagnostics):"Webhook inviato; verifica non riuscita: "+(d.error||d.message||"errore");
 }catch(e){status.textContent="Errore di rete durante la configurazione. Non ripetere subito: controlliamo prima lo stato.";}
});
</script></html>
