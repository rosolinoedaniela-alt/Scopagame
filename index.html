<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scopa - Carte Napoletane</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle, #0a4223 0%, #051d10 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            overflow: hidden;
        }

        /* Intestazione stile seconda foto */
        .header {
            text-align: center;
            padding: 4px 0;
        }

        .header .presenta {
            font-size: 10px;
            letter-spacing: 2px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .header h1 {
            font-size: 20px;
            color: #f3e5ab;
            letter-spacing: 3px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .header h1 span {
            font-size: 14px;
            color: #d4af37;
        }

        .header .sub {
            font-size: 11px;
            color: #c2d6c4;
            margin-top: 2px;
        }

        .score-board {
            margin-top: 4px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Barra obiettivo stile seconda foto */
        .progress-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            height: 8px;
            margin: 4px 0;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #f3e5ab);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .objective-text {
            font-size: 10px;
            color: #a3c9a8;
            text-align: center;
            margin-bottom: 4px;
        }

        /* Sezioni Gioco */
        .section-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f3e5ab;
            text-align: center;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .area {
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 8px;
            background: rgba(4, 26, 14, 0.6);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .cards-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        /* Carta Grafica */
        .card {
            width: 60px;
            height: 95px;
            background-color: #fdfbf7;
            border-radius: 6px;
            border: 2px solid #b89728;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s ease;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card.selected {
            border-color: #ffffff;
            box-shadow: 0 0 12px #ffd700;
            transform: translateY(-6px);
        }

        /* Retro Carta */
        .card-back {
            background: repeating-linear-gradient(
                45deg,
                #8b0000,
                #8b0000 6px,
                #a52a2a 6px,
                #a52a2a 12px
            );
            border: 2px solid #d4af37;
        }

        .card-top, .card-bottom {
            font-size: 10px;
            font-weight: bold;
            color: #222;
        }

        .card-bottom {
            text-align: right;
            transform: rotate(180deg);
        }

        .card-center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            font-size: 14px;
            text-align: center;
        }

        /* Immagini SVG/Illustrate per le figure napoletane */
        .figure-img {
            width: 32px;
            height: 48px;
            object-fit: contain;
        }

        /* Colori Semi Napoletani */
        .seme-denari { color: #b8860b; }
        .seme-coppe { color: #b22222; }
        .seme-spade { color: #1e3f66; }
        .seme-bastoni { color: #4e3629; }

        /* Contatore Mazzo */
        .deck-badge {
            background: rgba(0,0,0,0.5);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 10px;
            color: #ffd700;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <!-- Header Personalizzato -->
    <div class="header">
        <div class="presenta">Monopolygoita Presenta</div>
        <h1><span>♠️</span> Scopa <span>♣️</span></h1>
        <div class="sub">Carte napoletane · Sfida contro il computer</div>
        <div class="score-board" id="scoreBoard">Tu 0 — Computer 0</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>
        <div class="objective-text">Obiettivo: 11 punti</div>
    </div>

    <!-- Area Avversario -->
    <div class="area">
        <div class="section-title">Avversario · Computer</div>
        <div class="cards-row" id="opponentHand">
            <div class="card card-back"></div>
            <div class="card card-back"></div>
            <div class="card card-back"></div>
        </div>
    </div>

    <!-- Tavolo da Gioco -->
    <div class="area">
        <div class="section-title">✦ Tavolo da Gioco ✦</div>
        <div class="deck-badge" id="deckCount">🎴 Carte nel mazzo: 30</div>
        <div class="cards-row" id="tableCards"></div>
    </div>

    <!-- Le Tue Carte -->
    <div class="area">
        <div class="section-title">Le Tue Carte</div>
        <div class="cards-row" id="playerHand"></div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        // SVG dettagliati per le figure napoletane (Fante, Cavallo, Re)
        const FIGURES = {
            'Fante': `<svg viewBox="0 0 40 60" class="figure-img"><rect width="40" height="60" fill="#fdfbf7"/><circle cx="20" cy="20" r="8" fill="#ffdbac"/><path d="M12 32h16v20H12z" fill="#0066cc"/><path d="M10 16l10-8 10 8z" fill="#cc0000"/><text x="20" y="23" font-size="8" text-anchor="middle" fill="#333">F</text></svg>`,
            'Cavallo': `<svg viewBox="0 0 40 60" class="figure-img"><rect width="40" height="60" fill="#fdfbf7"/><path d="M8 20l12-8 12 8v28H8z" fill="#b8860b"/><circle cx="20" cy="22" r="7" fill="#ffdbac"/><text x="20" y="25" font-size="8" text-anchor="middle" fill="#333">C</text></svg>`,
            'Re': `<svg viewBox="0 0 40 60" class="figure-img"><rect width="40" height="60" fill="#fdfbf7"/><polygon points="12,12 20,4 28,12" fill="#ffd700"/><rect x="10" y="14" width="20" height="38" fill="#4b0082"/><text x="20" y="35" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffd700">RE</text></svg>`
        };

        const SYMBOLS = {
            'Denari': '🪙',
            'Coppe': '🏆',
            'Spade': '⚔️',
            'Bastoni': '🪵'
        };

        const CLASS_SEMI = {
            'Denari': 'seme-denari',
            'Coppe': 'seme-coppe',
            'Spade': 'seme-spade',
            'Bastoni': 'seme-bastoni'
        };

        let tavolo = [
            { valore: 4, seme: 'Denari' },
            { valore: 8, seme: 'Bastoni' },
            { valore: 9, seme: 'Coppe' },
            { valore: 10, seme: 'Spade' }
        ];

        let miaMano = [
            { valore: 1, seme: 'Denari' },
            { valore: 7, seme: 'Coppe' },
            { valore: 10, seme: 'Denari' }
        ];

        function renderCard(carta, onClick) {
            const el = document.createElement('div');
            el.className = 'card';
            
            const colorClass = CLASS_SEMI[carta.seme] || '';
            let valStr = carta.valore;
            let centerContent = '';

            if (carta.valore === 8) {
                valStr = 'Fante';
                centerContent = FIGURES['Fante'];
            } else if (carta.valore === 9) {
                valStr = 'Cavallo';
                centerContent = FIGURES['Cavallo'];
            } else if (carta.valore === 10) {
                valStr = 'Re';
                centerContent = FIGURES['Re'];
            } else {
                centerContent = `<span class="${colorClass}">${SYMBOLS[carta.seme]}</span>`;
            }

            el.innerHTML = `
                <div class="card-top ${colorClass}">${valStr === 1 ? 'Ace' : valStr}</div>
                <div class="card-center">${centerContent}</div>
                <div class="card-bottom ${colorClass}">${valStr === 1 ? 'Ace' : valStr}</div>
            `;

            if (onClick) {
                el.onclick = () => onClick(carta, el);
            }
            return el;
        }

        function renderGame() {
            const tableEl = document.getElementById('tableCards');
            const handEl = document.getElementById('playerHand');

            tableEl.innerHTML = '';
            handEl.innerHTML = '';

            tavolo.forEach(carta => {
                tableEl.appendChild(renderCard(carta, (c, el) => {
                    el.classList.toggle('selected');
                }));
            });

            miaMano.forEach(carta => {
                handEl.appendChild(renderCard(carta, (c, el) => {
                    document.querySelectorAll('#playerHand .card').forEach(card => card.classList.remove('selected'));
                    el.classList.toggle('selected');
                }));
            });
        }

        renderGame();
    </script>
</body>
</html>
