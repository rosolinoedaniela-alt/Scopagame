<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scopa Debug</title>
<style>
*{box-sizing:border-box}
:root{--gold:#f5d58b;--green:#063e2b;--cream:#fff4d9}
html, body {
 margin:0; padding:0; width:100%; height:100vh; height:100dvh;
 overflow:hidden !important; background:#04150e; color:var(--cream);
 font-family:Arial,sans-serif; text-align:center; display:flex; flex-direction:column; justify-content:space-between; padding:4px;
}
header { padding:4px; background:#062b1e; border:1px solid var(--gold); border-radius:6px; flex-shrink:0; }
h1{margin:0;color:var(--gold);font-size:12px}
main { flex:1; display:flex; flex-direction:column; justify-content:space-between; gap:4px; max-width:480px; margin:0 auto; width:100%; }
.panel { padding:4px; border:1px solid var(--gold); border-radius:6px; background:rgba(0,0,0,0.3); display:flex; flex-direction:column; align-items:center; }
.label{font-size:8px;color:var(--gold);font-weight:bold;margin-bottom:2px;text-transform:uppercase}
.area{ display:flex; justify-content:center; align-items:center; gap:4px; min-height:50px; width:100%; }
.card { width:50px; height:75px; background:#fff8e9; border:2px solid #e6d5a7; border-radius:5px; object-fit:contain; }
#debugLog { background:#000; color:#0f0; font-size:8px; text-align:left; padding:4px; height:45px; overflow-y:auto; border:1px solid #0f0; border-radius:4px; width:100%; font-family:monospace; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header>
 <h1>Scopa - Modalità Diagnostica</h1>
 <div id="status" style="font-size:9px;color:#ff4d4d;">Avvio in corso...</div>
</header>

<main>
 <div class="panel">
  <div class="label">Tavolo da Gioco</div>
  <div id="middle" class="area"></div>
 </div>

 <div class="panel">
  <div class="label">Le tue carte</div>
  <div id="player" class="area"></div>
 </div>

 <div class="panel" style="flex:1; justify-content:flex-start;">
  <div class="label">Log errori in tempo reale</div>
  <div id="debugLog">Inizializzazione...<br></div>
 </div>
</main>

<script>
function logDebug(msg) {
  const box = document.getElementById("debugLog");
  box.innerHTML += msg + "<br>";
  box.scrollTop = box.scrollHeight;
  console.log(msg);
}

const SUPABASE_URL = 'https://sommziqnmxgkwyjatxcn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qkiuSaslucRFunQhtFc48Q_cY8_um9C';

try {
  logDebug("Caricamento libreria Supabase...");
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  logDebug("Client Supabase creato con successo.");

  const suits = ["denari", "coppe", "spade", "bastoni"];
  const files = [
    "01 Asso di denari.jpg","02 Due di denari.jpg","03 Tre di denari.jpg","04 Quattro di denari.jpg","05 Cinque di denari.jpg","06 Sei di denari.jpg","07 Sette di denari.jpg","08 Otto di denari.jpg","09 Nove di denari.jpg","10 Dieci di denari.jpg",
    "11 Asso di coppe.jpg","12 Due di coppe.jpg","13 Tre di coppe.jpg","14 Quattro di coppe.jpg","15 Cinque di coppe.jpg","16 Sei di coppe.jpg","17 Sette di coppe.jpg","18 Otto di coppe.jpg","19 Nove di coppe.jpg","20 Dieci di coppe.jpg",
    "21 Asso di spade.jpg","22 Due di spade.jpg","23 Tre di spade.jpg","24 Quattro di spade.jpg","25 Cinque di spade.jpg","26 Sei di spade.jpg","27 Sette di spade.jpg","28 Otto di spade.jpg","29 Nove di spade.jpg","30 Dieci di spade.jpg",
    "31 Asso di bastoni.jpg","32 Due di bastoni.jpg","33 Tre di bastoni.jpg","34 Quattro di bastoni.jpg","35 Cinque di bastoni.jpg","36 Sei di bastoni.jpg","37 Sette di bastoni.jpg","38 Otto di bastoni.jpg","39 Nove di bastoni.jpg","40 Dieci di Bastoni.jpg"
  ];

  function makeDeck(){
    return files.map((file,i)=>({
      id:i+1, rank:(i%10)+1, suit:suits[Math.floor(i/10)], file, value:(i%10)+1
    })).sort(() => Math.random() - 0.5);
  }

  function imageURL(c){
    let fname = c.file.replace("Dieci di Bastoni.jpg", "40 Dieci di Bastoni.jpg");
    return "https://commons.wikimedia.org/w/index.php?title=Special:FilePath&file=" + encodeURIComponent(fname);
  }

  window.addEventListener('DOMContentLoaded', async () => {
    logDebug("DOM caricato. Generazione mazzo locale...");
    const deck = makeDeck();
    const board = [deck.pop(), deck.pop(), deck.pop(), deck.pop()];
    const hand = [deck.pop(), deck.pop(), deck.pop()];

    logDebug("Disegno tavolo (" + board.length + " carte) e mano ("+ hand.length +" carte)...");

    const mArea = document.getElementById("middle");
    const pArea = document.getElementById("player");

    board.forEach(c => {
      const im = document.createElement("img");
      im.className = "card";
      im.src = imageURL(c);
      mArea.appendChild(im);
    });

    hand.forEach(c => {
      const im = document.createElement("img");
      im.className = "card";
      im.src = imageURL(c);
      pArea.appendChild(im);
    });

    document.getElementById("status").textContent = "Test di rendering completato!";
    logDebug("Rendering completato con successo!");
  });

} catch (err) {
  logDebug("ERRORE CRITICO: " + err.message);
}
</script>
</body>
</html>
