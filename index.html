<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scopa Monopolygoita</title>

*{box-sizing:border-box}
:root{--gold:#f5d58b;--green:#063e2b;--cream:#fff4d9}
html, body {
 margin:0; padding:0; width:100%; height:100vh; height:100dvh;
 overflow:hidden !important; background:radial-gradient(ellipse at top,#1b5e3f,#04150e 85%);
 color:var(--cream); font-family:Arial,sans-serif; text-align:center;
 display:flex; flex-direction:column; justify-content:space-between; padding:2px 4px;
}
header {
 padding:2px 6px; background:linear-gradient(135deg,#062b1e,#134e32,#062b1e);
 border:1px solid var(--gold); border-radius:6px; flex-shrink:0;
}
.brand{font-size:7px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
h1{margin:0;color:var(--gold);font-size:11px;letter-spacing:1px}
#score{font-size:9px;font-weight:bold;margin:1px 0;color:#ffe7a7}
#connectionStatus{font-size:8px;color:#f5d58b}

main {

}
.panel {
 margin:0; padding:2px 4px; border:1px solid #f5d58b55; border-radius:6px;
 background:linear-gradient(145deg,rgba(255,255,255,0.04),rgba(0,0,0,0.2));
 display:flex; flex-direction:column; justify-content:center; align-items:center; transition:all 0.3s ease;
}
.panel.active-turn { border:2px solid #ff4d4d !important; box-shadow:0 0 10px rgba(255, 77, 77, 0.7); }
.label{font-size:7px;letter-spacing:1px;color:var(--gold);font-weight:bold;margin-bottom:1px;text-transform:uppercase}
.area{ display:flex; justify-content:center; align-items:center; gap:4px; flex-wrap:nowrap; min-height:45px; width:100%; padding:1px; }

#table { background:radial-gradient(ellipse,#18633e,#083824); border:1px double var(--gold); min-height:50px; position:relative; }
#remaining { position:absolute; top:2px; right:4px; padding:1px 3px; border:1px solid var(--gold); border-radius:3px; background:#042116; color:#ffe7a7; font-size:7px; font-weight:bold; }

.card {

}
.card.selected{transform:translateY(-4px);outline:3px solid #ffe17c;box-shadow:0 0 8px #ffdf76}
