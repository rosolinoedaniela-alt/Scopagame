<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scopa Monopolygoita</title>
<style>
*{box-sizing:border-box}
:root{--gold:#f5d58b;--green:#063e2b;--cream:#fff4d9}
html, body {
 margin:0;
 padding:0;
 width:100%;
 height:100vh;
 overflow:hidden !important;
 background:radial-gradient(ellipse at top,#287a50,#061c14 78%);
 color:var(--cream);
 font-family:Arial,sans-serif;
 text-align:center;
}

body {
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 padding:4px 6px;
}

header {
 padding:2px 5px;
 background:linear-gradient(135deg,#08291d,#1c6945,#08291d);
 border-bottom:1px solid var(--gold);
 border-radius:8px;
 flex-shrink:0;
}
.brand{font-size:8px;letter-spacing:1px;color:var(--gold)}
h1{margin:1px 0;color:var(--gold);font-size:14px;letter-spacing:1px}
#score{font-size:11px;font-weight:bold;margin:1px 0;color:#ffe7a7}
#connectionStatus{font-size:9px;color:#f5d58b}

main {
 flex:1;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 gap:4px;
 max-width:480px;
 margin:auto;
 width:100%;
 padding:2px 0;
}

.panel {
 margin:0;
 padding:3px;
 border:1px solid #f5d58b77;
 border-radius:10px;
 background:linear-gradient(145deg,#ffffff12,#00000022);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
}

.label{font-size:9px;letter-spacing:1px;color:var(--gold);font-weight:bold;margin-bottom:2px}

.area{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:4px;
 flex-wrap:nowrap;
 min-height:50px;
 width:100%;
 padding:1px;
}

#table {
 background:radial-gradient(ellipse,#258456,#0b4931);
 border:1px double #f5d58b;
 min-height:65px;
}

#remaining {
 display:inline-block;
 margin-bottom:2px;
 padding:1px 8px;
 border:1px solid var(--gold);
 border-radius:10px;
 background:#05291d;
 color:#ffe7a7;
 font-size:10px;
}

.card {
 width:clamp(32px, 10vw, 45px);
 height:auto;
 aspect-ratio:1324/2188;
 object-fit:contain;
 background:#fff8e9;
 border:1px solid #e6d5a7;
 border-radius:4px;
 cursor:pointer;
 transition:transform .15s;
}
.card.selected{transform:translateY(-4px);outline:2px solid #ffe17c;box-shadow:0 0 8px #ffdf76}
.back {
 height:52px;
 width:clamp(32px, 10vw, 45px);
 background:repeating-linear-gradient(45deg,#8b2530,#8b2530 4px,#f2d8a4 5px,#8b2530 7px);
 border:1px double #f2d8a4;
 border-radius:4px;
}

button {
 border:1px solid #ffe3a0;
 border-radius:6px;
 padding:4px 10px;
 margin:1px;
 background:linear-gradient(135deg,#ffe6a0,#bd8e35);
 color:#183522;
 font-weight:bold;
 font-size:11px;
 cursor:pointer;
}

#message{font-size:10px;font-weight:bold;color:#ffe7a7;min-height:14px;margin:1px 0}

#chat {padding:3px}
#chatlog {height:30px;overflow-y:auto;background:#031c13aa;border-radius:4px;padding:3px;font-size:10px;width:100%;text-align:left}
.chatrow {display:flex;gap:4px;margin-top:2px;width:100%}
#chatInput {flex:1;border-radius:4px;padding:3px 6px;border:1px solid #c6a85e;font-size:10px}

footer {font-size:8px;color:#d4c39c;padding:2px;flex-shrink:0}
.hidden{display:none!important}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header>
 <div class="brand">Dany presenta</div>
 <h1>Scopa di Monopolygoita</h1>
 <div id="connectionStatus">Connessione al tavolo...</div>
 <div id="score">Giocatore 1: 0 — Giocatore 2: 0</div>
</header>

<main>
 <section class="panel">
  <div id="opponentLabel" class="label">AVVERSARIO · IN ATTESA...</div>
  <div id="opponent" class="area"></div>
 </section>

 <section class="panel" id="table">
  <div class="label">✦ TAVOLO DA GIOCO ✦</div>
  <div id="remaining">🂠 MAZZO: --</div>
  <div id="middle" class="area"></div>
 </section>

 <section class="panel">
  <div id="myRoleLabel" class="label">LE TUE CARTE</div>
  <div id="player" class="area"></div>
  <button id="play" onclick="playPlayerCard()" disabled>Gioca carta</button>
  <button id="spectateBtn" class="hidden" onclick="joinAsSpectator()">👁️ Entra come Spettatore</button>
 </section>

 <div id="message" aria-live="polite"></div>

 <section class="panel" id="chat">
  <div class="label">💬 CHAT DEL TAVOLO</div>
  <div id="chatlog" aria-live="polite">Connesso al tavolo.</div>
  <div class="chatrow">
   <input id="chatInput" maxlength="180" placeholder="Messaggio…">
   <button onclick="sendChat()">Invia</button>
  </div>
 </section>
</main>

<footer>Scopa Napoletana · Monopolygoita</footer>

<script>
const SUPABASE_URL = 'https://sommziqnmxgkwyjatxcn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qkiuSaslucRFunQhtFc48Q_cY8_um9C';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tg = window.Telegram?.WebApp || {};
try { if (tg.expand) tg.expand(); } catch(e){}

const user = tg.initDataUnsafe?.user;
const userId = user ? user.id : Math.floor(Math.random() * 1000000);
const userName = user ? (user.first_name || 'Giocatore') : 'Ospite_' + userId;
const chatId = tg.initDataUnsafe?.chat?.id || tg.initDataUnsafe?.user?.id || 12345;

let currentGameId = null;
let playerRole = 'spectator';
let gameState = {
  board_cards: [],
  player1_hand: [],
  player2_hand: [],
  player1_captured: [],
  player2_captured: [],
  player1_score: 0,
  player2_score: 0,
  player1_scope: 0,
  player2_scope: 0,
  last_capture_role: null,
  deck: [],
  turn: null,
  status: 'waiting',
  player1_id: null,
  player1_name: 'In attesa...',
  player2_id: null,
  player2_name: 'In attesa...'
};
let selectedCardId = null;

const suits = ["denari", "coppe", "spade", "bastoni"];
const files = [
  "01 Asso di denari.jpg","02 Due di denari.jpg","03 Tre di denari.jpg","04 Quattro di denari.jpg","05 Cinque di denari.jpg","06 Sei di denari.jpg","07 Sette di denari.jpg","08 Otto di denari.jpg","09 Nove di denari.jpg","10 Dieci di denari.jpg",
  "11 Asso di coppe.jpg","12 Due di coppe.jpg","13 Tre di coppe.jpg","14 Quattro di coppe.jpg","15 Cinque di coppe.jpg","16 Sei di coppe.jpg","17 Sette di coppe.jpg","18 Otto di coppe.jpg","19 Nove di coppe.jpg","20 Dieci di coppe.jpg",
  "21 Asso di spade.jpg","22 Due di spade.jpg","23 Tre di spade.jpg","24 Quattro di spade.jpg","25 Cinque di spade.jpg","26 Sei di spade.jpg","27 Sette di spade.jpg","28 Otto di spade.jpg","29 Nove di spade.jpg","30 Dieci di spade.jpg",
  "31 Asso di bastoni.jpg","32 Due di bastoni.jpg","33 Tre di bastoni.jpg","34 Quattro di bastoni.jpg","35 Cinque di bastoni.jpg","36 Sei di bastoni.jpg","37 Sette di bastoni.jpg","38 Otto di bastoni.jpg","39 Nove di bastoni.jpg","40 Dieci di Bastoni.jpg"
];

function makeDeck(){
 const d=files.map((file,i)=>({
  id:i+1,rank:i%10+1,suit:suits[Math.floor(i/10)],
  file,value:i%10+1
 }));
 for(let i=d.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [d[i],d[j]]=[d[j],d[i]];
 }
 return d;
}

function imageURL(c){
 let fname = c.file.replace("Dieci di Bastoni.jpg", "40 Dieci di Bastoni.jpg");
 return "https://commons.wikimedia.org/w/index.php?title=Special:FilePath&file=" + encodeURIComponent(fname);
}

async function initMultiplayer() {
  document.getElementById("connectionStatus").textContent = "Connessione al tavolo...";

  let { data: games } = await supabase
    .from('games')
    .select('*')
    .eq('chat_id', chatId)
    .neq('status', 'finished')
    .limit(1);

  if (games && games.length > 0) {
    const game = games[0];
    currentGameId = game.id;
    gameState = game;

    if (game.player1_id === userId) {
      playerRole = 'player1';
      document.getElementById("connectionStatus").textContent = "Sei il Giocatore 1";
    } else if (game.player2_id === userId) {
      playerRole = 'player2';
      document.getElementById("connectionStatus").textContent = "Sei il Giocatore 2";
    } else if (!game.player2_id || game.status === 'waiting') {
      playerRole = 'player2';
      const deck = game.deck && game.deck.length > 0 ? game.deck : makeDeck();
      const board = game.board_cards && game.board_cards.length > 0 ? game.board_cards : [deck.pop(), deck.pop(), deck.pop(), deck.pop()];
      const p1Hand = game.player1_hand && game.player1_hand.length > 0 ? game.player1_hand : [deck.pop(), deck.pop(), deck.pop()];
      const p2Hand = [deck.pop(), deck.pop(), deck.pop()];

      const updateData = {
        player2_id: userId,
        player2_name: userName,
        status: 'playing',
        board_cards: board,
        player1_hand: p1Hand,
        player2_hand: p2Hand,
        deck: deck,
        turn: game.player1_id
      };

      await supabase.from('games').update(updateData).eq('id', currentGameId);
      Object.assign(gameState, updateData);
      document.getElementById("connectionStatus").textContent = "Partita iniziata!";
    } else {
      document.getElementById("spectateBtn").classList.remove("hidden");
      document.getElementById("connectionStatus").textContent = "Tavolo occupato. Spettatore disponibile.";
    }
  } else {
    const deck = makeDeck();
    const board = [deck.pop(), deck.pop(), deck.pop(), deck.pop()];
    const p1Hand = [deck.pop(), deck.pop(), deck.pop()];
    
    const newRecord = {
      chat_id: chatId,
      player1_id: userId,
      player1_name: userName,
      status: 'waiting',
      board_cards: board,
      player1_hand: p1Hand,
      player2_hand: [],
      player1_captured: [],
      player2_captured: [],
      player1_score: 0,
      player2_score: 0,
      player1_scope: 0,
      player2_scope: 0,
      deck: deck,
      turn: userId
    };

    const { data: newGame } = await supabase.from('games').insert([newRecord]).select().single();

    if (newGame) {
      currentGameId = newGame.id;
      gameState = newGame;
      playerRole = 'player1';
      document.getElementById("connectionStatus").textContent = "Tavolo creato. In attesa del G2...";
    }
  }

  render();
  subscribeRealtime();
}

function joinAsSpectator() {
  playerRole = 'spectator';
  document.getElementById("spectateBtn").classList.add("hidden");
  document.getElementById("connectionStatus").textContent = "👁️ Entrato come Spettatore";
  render();
}

function subscribeRealtime() {
  if (!currentGameId) return;
  supabase
    .channel('room_' + currentGameId)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: `id=eq.${currentGameId}` }, (payload) => {
      gameState = payload.new;
      render();
    })
    .subscribe();
}

function render() {
  const pArea = document.getElementById("player");
  const mArea = document.getElementById("middle");
  const oArea = document.getElementById("opponent");

  pArea.replaceChildren();
  mArea.replaceChildren();
  oArea.replaceChildren();

  document.getElementById("score").textContent = 
    `${gameState.player1_name || 'G1'}: ${gameState.player1_score || 0} — ${gameState.player2_name || 'G2'}: ${gameState.player2_score || 0}`;

  if (playerRole === 'spectator') {
    document.getElementById("myRoleLabel").textContent = "CARTE " + (gameState.player1_name || "G1");
    document.getElementById("opponentLabel").textContent = "CARTE " + (gameState.player2_name || "G2");
    document.getElementById("play").classList.add("hidden");
  } else {
    const isP1 = (playerRole === 'player1');
    document.getElementById("myRoleLabel").textContent = "LE TUE CARTE (" + (isP1 ? gameState.player1_name : gameState.player2_name) + ")";
    document.getElementById("opponentLabel").textContent = "AVVERSARIO · " + (isP1 ? (gameState.player2_name || "In attesa...") : gameState.player1_name);
    document.getElementById("play").classList.remove("hidden");
  }

  const myHand = (playerRole === 'spectator' || playerRole === 'player1') ? gameState.player1_hand : gameState.player2_hand;
  if (myHand && Array.isArray(myHand)) {
    myHand.forEach(c => {
      const im = document.createElement("img");
      im.className = "card" + (selectedCardId === c.id ? " selected" : "");
      im.src = imageURL(c);
      im.alt = c.file;
      im.onclick = () => {
        if (playerRole !== 'spectator' && gameState.turn === userId && gameState.status === 'playing') {
          selectedCardId = c.id;
          render();
        }
      };
      pArea.appendChild(im);
    });
  }

  const oppHand = (playerRole === 'spectator' || playerRole === 'player1') ? gameState.player2_hand : gameState.player1_hand;
  if (oppHand && Array.isArray(oppHand)) {
    oppHand.forEach(() => {
      const b = document.createElement("div");
      b.className = "card back";
      oArea.appendChild(b);
    });
  }

  if (gameState.board_cards && Array.isArray(gameState.board_cards)) {
    gameState.board_cards.forEach(c => {
      const im = document.createElement("img");
      im.className = "card";
      im.src = imageURL(c);
      mArea.appendChild(im);
    });
  }

  if (gameState.deck) {
    document.getElementById("remaining").textContent = "🂠 MAZZO: " + gameState.deck.length;
  }

  const myTurn = (gameState.turn === userId && gameState.status === 'playing' && playerRole !== 'spectator');
  document.getElementById("play").disabled = !myTurn || selectedCardId === null;

  if (gameState.status === 'finished') {
    say("🏆 PARTITA TERMINATA! Vince " + (gameState.winner_name || "un giocatore") + "!");
    setTimeout(() => { if (tg.close) tg.close(); }, 4500);
  } else if (gameState.status === 'waiting') {
    say("In attesa del Giocatore 2 per iniziare...");
  } else if (playerRole === 'spectator') {
    say("👁️ Stai assistendo alla partita in diretta.");
  } else if (myTurn) {
    say("Tocca a te! Scegli una carta e gioca.");
  } else {
    say("Turno dell'avversario...");
  }
}

function say(t) {
  document.getElementById("message").textContent = t;
}

async function playPlayerCard() {
  if (playerRole === 'spectator') return;

  const isP1 = (playerRole === 'player1');
  const myHand = isP1 ? [...(gameState.player1_hand || [])] : [...(gameState.player2_hand || [])];
  const card = myHand.find(c => c.id === selectedCardId);
  if (!card) return;

  const newMyHand = myHand.filter(c => c.id !== card.id);
  let board = [...(gameState.board_cards || [])];
  let captured = isP1 ? [...(gameState.player1_captured || [])] : [...(gameState.player2_captured || [])];
  let scope = isP1 ? (gameState.player1_scope || 0) : (gameState.player2_scope || 0);

  let exactIndex = board.findIndex(c => c.value === card.value);
  let isCapture = false;

  if (exactIndex !== -1) {
    const taken = board.splice(exactIndex, 1)[0];
    captured.push(card, taken);
    isCapture = true;
  } else {
    board.push(card);
  }

  if (isCapture && board.length === 0) {
    scope += 1;
  }

  let deck = [...(gameState.deck || [])];
  let p1Hand = isP1 ? newMyHand : [...(gameState.player1_hand || [])];
  let p2Hand = isP1 ? [...(gameState.player2_hand || [])] : newMyHand;

  if (p1Hand.length === 0 && p2Hand.length === 0 && deck.length > 0) {
    p1Hand = [deck.pop(), deck.pop(), deck.pop()];
    p2Hand = [deck.pop(), deck.pop(), deck.pop()];
  }

  const nextTurnId = isP1 ? gameState.player2_id : gameState.player1_id;

  let updatePayload = {
    board_cards: board,
    player1_hand: p1Hand,
    player2_hand: p2Hand,
    deck: deck,
    turn: nextTurnId,
    last_capture_role: isCapture ? playerRole : gameState.last_capture_role
  };

  if (isP1) {
    updatePayload.player1_captured = captured;
    updatePayload.player1_scope = scope;
  } else {
    updatePayload.player2_captured = captured;
    updatePayload.player2_scope = scope;
  }

  selectedCardId = null;
  await supabase.from('games').update(updatePayload).eq('id', currentGameId);
}

function sendChat() {
  const input = document.getElementById("chatInput");
  const val = input.value.trim();
  if(!val) return;
  const log = document.getElementById("chatlog");
  const line = document.createElement("div");
  line.textContent = userName + ": " + val;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  input.value = "";
}

window.addEventListener('DOMContentLoaded', () => {
  initMultiplayer();
});
</script>
</body>
</html>
