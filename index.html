x<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scopa - Carte Napoletane</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle, #0a4223 0%, #051d10 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 2px 0;
        }

        .header .presenta {
            font-size: 9px;
            letter-spacing: 2px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 1px;
        }

        .header h1 {
            font-size: 18px;
            color: #f3e5ab;
            letter-spacing: 3px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .header h1 span {
            font-size: 13px;
            color: #d4af37;
        }

        .header .sub {
            font-size: 10px;
            color: #c2d6c4;
            margin-top: 1px;
        }

        .score-board {
            margin-top: 2px;
            font-size: 13px;
            font-weight: bold;
            color: #ffd700;
        }

        .progress-container {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            height: 6px;
            margin: 3px 0;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #f3e5ab);
            border-radius: 10px;
        }

        .objective-text {
            font-size: 9px;
            color: #a3c9a8;
            text-align: center;
            margin-bottom: 3px;
        }

        .section-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f3e5ab;
            text-align: center;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .area {
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 6px;
            background: rgba(4, 26, 14, 0.6);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .cards-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .card {
            width: 58px;
            height: 92px;
            background-color: #fdfbf7;
            border-radius: 5px;
            border: 2px solid #b89728;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3px;
            cursor: pointer;
            position: relative;
            transition: transform 0.15s ease;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card.selected {
            border-color: #ffffff;
            box-shadow: 0 0 10px #ffd700;
            transform: translateY(-5px);
        }

        .card-back {
            background: repeating-linear-gradient(
                45deg,
                #8b0000,
                #8b0000 5px,
                #a52a2a 5px,
                #a52a2a 10px
            );
            border: 2px solid #d4af37;
        }

        .card-top, .card-bottom {
            font-size: 9px;
            font-weight: bold;
            color: #222;
        }

        .card-bottom {
            text-align: right;
            transform: rotate(180deg);
        }

        .card-center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            font-size: 13px;
            text-align: center;
        }

        /* Illustrazioni dettagliate stile napoletano tradizionale */
        .figure-art {
            width: 32px;
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .fante-ico { background: linear-gradient(135deg, #0044cc 0%, #002266 100%); border-radius: 3px; width: 28px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ffd700; font-size: 10px; font-weight: bold; border: 1px solid #ffcc00; }
        .cavallo-ico { background: linear-gradient(135deg, #b8860b 0%, #5c4033 100%); border-radius: 3px; width: 28px; height: 44px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: bold; border: 1px solid #ffd700; }
        .re-ico { background: linear-gradient(135deg, #660066 0%, #330033 100%); border-radius: 3px; width: 28px; height: 44px; display: flex; align-items: center; justify-content: center; color: #ffd700; font-size: 11px; font-weight: bold; border: 1px solid #ffd700; box-shadow: inset 0 0 4px #ff99ff; }

        .seme-denari { color: #b8860b; }
        .seme-coppe { color: #b22222; }
        .seme-spade { color: #1e3f66; }
        .seme-bastoni { color: #4e3629; }

        .deck-badge {
            background: rgba(0,0,0,0.5);
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 2px 8px;
            font-size: 9px;
            color: #ffd700;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="presenta">Monopolygoita Presenta</div>
        <h1><span>♠️</span> Scopa <span>♣️</span></h1>
        <div class="sub">Carte napoletane · Sfida contro il computer</div>
        <div class="score-board" id="scoreBoard">Tu 0 — Computer 0</div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>
        <div class="objective-text">Obiettivo: 11 punti</div>
    </div>

    <div class="area">
        <div class="section-title">Avversario · Computer</div>
        <div class="cards-row" id="opponentHand">
            <div class="card card-back"></div>
            <div class="card card-back"></div>
            <div class="card card-back"></div>
        </div>
    </div>

    <div class="area">
        <div class="section-title">✦ Tavolo da Gioco ✦</div>
        <div class="deck-badge" id="deckCount">🎴 Carte nel mazzo: 30</div>
        <div class="cards-row" id="tableCards"></div>
    </div>

    <div class="area">
        <div class="section-title">Le Tue Carte</div>
        <div class="cards-row" id="playerHand"></div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        const SYMBOLS = {
            'Denari': '🪙',
            'Coppe': '🏆',
            'Spade': '⚔️',
            'Bastoni': '🪵'
        };

        const CLASS_SEMI = {
            'Denari': 'seme-denari',
            'Coppe': 'seme-coppe',
            'Spade': 'seme-spade',
            'Bastoni': 'seme-bastoni'
        };

        let tavolo = [
            { valore: 4, seme: 'Denari' },
            { valore: 8, seme: 'Bastoni' },
            { valore: 9, seme: 'Coppe' },
            { valore: 10, seme: 'Spade' }
        ];

        let miaMano = [
            { valore: 1, seme: 'Coppe' },
            { valore: 7, seme: 'Denari' },
            { valore: 8, seme: 'Spade' }
        ];

        function renderCard(carta, onClick) {
            const el = document.createElement('div');
            el.className = 'card';
            
            const colorClass = CLASS_SEMI[carta.seme] || '';
            let valStr = carta.valore;
            let displayVal = valStr === 1 ? 'Asso' : valStr;
            let centerContent = '';

            if (valStr === 8) {
                displayVal = 'Fante';
                centerContent = `<div class="figure-art"><div class="fante-ico">Fante</div></div>`;
            } else if (valStr === 9) {
                displayVal = 'Cavallo';
                centerContent = `<div class="figure-art"><div class="cavallo-ico">Cav.</div></div>`;
            } else if (valStr === 10) {
                displayVal = 'Re';
                centerContent = `<div class="figure-art"><div class="re-ico">RE</div></div>`;
            } else {
                let repeatingSymbols = SYMBOLS[carta.seme].repeat(Math.min(valStr, 3));
                centerContent = `<span class="${colorClass}" style="font-size: 16px;">${repeatingSymbols}</span>`;
            }

            el.innerHTML = `
                <div class="card-top ${colorClass}">${displayVal}</div>
                <div class="card-center">${centerContent}</div>
                <div class="card-bottom ${colorClass}">${displayVal}</div>
            `;

            if (onClick) {
                el.onclick = () => onClick(carta, el);
            }
            return el;
        }

        function renderGame() {
            const tableEl = document.getElementById('tableCards');
            const handEl = document.getElementById('playerHand');

            tableEl.innerHTML = '';
            handEl.innerHTML = '';

            tavolo.forEach(carta => {
                tableEl.appendChild(renderCard(carta, (c, el) => {
                    el.classList.toggle('selected');
                }));
            });

            miaMano.forEach(carta => {
                handEl.appendChild(renderCard(carta, (c, el) => {
                    document.querySelectorAll('#playerHand .card').forEach(card => card.classList.remove('selected'));
                    el.classList.toggle('selected');
                }));
            });
        }

        renderGame();
    </script>
</body>
</html>
