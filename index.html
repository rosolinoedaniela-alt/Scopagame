<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Scopa - Carte Napoletane</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle, #0f522e 0%, #062313 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            overflow: hidden;
        }

        /* Intestazione */
        .header {
            text-align: center;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .header h1 {
            font-size: 18px;
            color: #f3e5ab;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .header .sub {
            font-size: 11px;
            color: #a3c9a8;
        }

        .score-board {
            margin-top: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Sezione Gioco */
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f3e5ab;
            text-align: center;
            margin-bottom: 6px;
        }

        .area {
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .cards-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        /* Carta */
        .card {
            width: 65px;
            height: 100px;
            background-color: #fdfbf7;
            border-radius: 6px;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 12px #ffd700;
            transform: translateY(-6px);
        }

        /* Retro Carta */
        .card-back {
            background: repeating-linear-gradient(
                45deg,
                #8b0000,
                #8b0000 8px,
                #a52a2a 8px,
                #a52a2a 16px
            );
            border: 2px solid #d4af37;
        }

        .card-top, .card-bottom {
            font-size: 10px;
            font-weight: bold;
            color: #222;
        }

        .card-bottom {
            text-align: right;
            transform: rotate(180deg);
        }

        .card-center {
            font-size: 22px;
            text-align: center;
            line-height: 1;
        }

        /* Colori Semi Napoletani */
        .seme-denari { color: #d4af37; }
        .seme-coppe { color: #d9381e; }
        .seme-spade { color: #2b5b84; }
        .seme-bastoni { color: #3e2723; }

        /* Contatore Mazzo */
        .deck-badge {
            background: rgba(0,0,0,0.6);
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 11px;
            color: #ffd700;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>SCOPA</h1>
        <div class="sub">Carte Napoletane · Tavolo Verde</div>
        <div class="score-board" id="scoreBoard">Tu 0 — 0 Avversario</div>
    </div>

    <!-- Area Avversario -->
    <div class="area">
        <div class="section-title">Avversario</div>
        <div class="cards-row" id="opponentHand">
            <div class="card card-back"></div>
            <div class="card card-back"></div>
            <div class="card card-back"></div>
        </div>
    </div>

    <!-- Tavolo da Gioco -->
    <div class="area">
        <div class="section-title">✦ Tavolo da Gioco ✦</div>
        <div class="deck-badge" id="deckCount">🎴 Carte nel mazzo: 30</div>
        <div class="cards-row" id="tableCards">
            <!-- Carte sul tavolo generate dinamicamente -->
        </div>
    </div>

    <!-- Le Tue Carte -->
    <div class="area">
        <div class="section-title">Le Tue Carte</div>
        <div class="cards-row" id="playerHand">
            <!-- Carte del giocatore -->
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        const SYMBOLS = {
            'Denari': '🟡',
            'Coppe': '🏆',
            'Spade': '⚔️',
            'Bastoni': '🪵'
        };

        const CLASS_SEMI = {
            'Denari': 'seme-denari',
            'Coppe': 'seme-coppe',
            'Spade': 'seme-spade',
            'Bastoni': 'seme-bastoni'
        };

        let tavolo = [
            { valore: 4, seme: 'Denari' },
            { valore: 3, seme: 'Bastoni' },
            { valore: 6, seme: 'Bastoni' },
            { valore: 9, seme: 'Coppe' }
        ];

        let miaMano = [
            { valore: 1, seme: 'Denari' },
            { valore: 7, seme: 'Coppe' },
            { valore: 10, seme: 'Spade' }
        ];

        function renderCard(carta, onClick) {
            const el = document.createElement('div');
            el.className = 'card';
            
            const symbol = SYMBOLS[carta.seme] || '🎴';
            const colorClass = CLASS_SEMI[carta.seme] || '';

            let valStr = carta.valore;
            if (carta.valore === 8) valStr = 'Fante';
            if (carta.valore === 9) valStr = 'Cavallo';
            if (carta.valore === 10) valStr = 'Re';

            el.innerHTML = `
                <div class="card-top ${colorClass}">${valStr}</div>
                <div class="card-center ${colorClass}">${symbol}</div>
                <div class="card-bottom ${colorClass}">${valStr}</div>
            `;

            if (onClick) {
                el.onclick = () => onClick(carta, el);
            }
            return el;
        }

        function renderGame() {
            const tableEl = document.getElementById('tableCards');
            const handEl = document.getElementById('playerHand');

            tableEl.innerHTML = '';
            handEl.innerHTML = '';

            tavolo.forEach(carta => {
                tableEl.appendChild(renderCard(carta, (c, el) => {
                    el.classList.toggle('selected');
                }));
            });

            miaMano.forEach(carta => {
                handEl.appendChild(renderCard(carta, (c, el) => {
                    document.querySelectorAll('#playerHand .card').forEach(card => card.classList.remove('selected'));
                    el.classList.addClass ? el.classList.add('selected') : el.classList.toggle('selected');
                }));
            });
        }

        renderGame();
    </script>
</body>
</html>
