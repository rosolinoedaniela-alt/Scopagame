<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scopa Monopolygoita</title>
<style>
*{box-sizing:border-box}
:root{--gold:#f5d58b;--green:#063e2b;--cream:#fff4d9}
html, body {
 margin:0;
 padding:0;
 width:100%;
 height:100vh;
 overflow:hidden !important;
 background:radial-gradient(ellipse at top,#287a50,#061c14 78%);
 color:var(--cream);
 font-family:Arial,sans-serif;
 text-align:center;
}

body {
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 padding:4px 6px;
}

header {
 padding:2px 5px;
 background:linear-gradient(135deg,#08291d,#1c6945,#08291d);
 border-bottom:1px solid var(--gold);
 border-radius:8px;
 flex-shrink:0;
}
.brand{font-size:8px;letter-spacing:1px;color:var(--gold)}
h1{margin:1px 0;color:var(--gold);font-size:14px;letter-spacing:1px}
#score{font-size:11px;font-weight:bold;margin:1px 0}
#connectionStatus{font-size:9px;color:#f5d58b}

main {
 flex:1;
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 gap:4px;
 max-width:480px;
 margin:auto;
 width:100%;
 padding:2px 0;
}

.panel {
 margin:0;
 padding:3px;
 border:1px solid #f5d58b77;
 border-radius:10px;
 background:linear-gradient(145deg,#ffffff12,#00000022);
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
}

.label{font-size:9px;letter-spacing:1px;color:var(--gold);font-weight:bold;margin-bottom:2px}

.area{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:4px;
 flex-wrap:nowrap;
 min-height:50px;
 width:100%;
 padding:1px;
}

#table {
 background:radial-gradient(ellipse,#258456,#0b4931);
 border:1px double #f5d58b;
 min-height:65px;
}

#remaining {
 display:inline-block;
 margin-bottom:2px;
 padding:1px 8px;
 border:1px solid var(--gold);
 border-radius:10px;
 background:#05291d;
 color:#ffe7a7;
 font-size:10px;
}

.card {
 width:clamp(32px, 10vw, 45px);
 height:auto;
 aspect-ratio:1324/2188;
 object-fit:contain;
 background:#fff8e9;
 border:1px solid #e6d5a7;
 border-radius:4px;
 cursor:pointer;
 transition:transform .15s;
}
.card.selected{transform:translateY(-4px);outline:2px solid #ffe17c;box-shadow:0 0 8px #ffdf76}
.back {
 height:52px;
 width:clamp(32px, 10vw, 45px);
 background:repeating-linear-gradient(45deg,#8b2530,#8b2530 4px,#f2d8a4 5px,#8b2530 7px);
 border:1px double #f2d8a4;
 border-radius:4px;
}

button {
 border:1px solid #ffe3a0;
 border-radius:6px;
 padding:4px 10px;
 margin:1px;
 background:linear-gradient(135deg,#ffe6a0,#bd8e35);
 color:#183522;
 font-weight:bold;
 font-size:11px;
 cursor:pointer;
}

#message{font-size:10px;font-weight:bold;color:#ffe7a7;min-height:14px;margin:1px 0}

#chat {padding:3px}
#chatlog {height:30px;overflow-y:auto;background:#031c13aa;border-radius:4px;padding:3px;font-size:10px;width:100%;text-align:left}
.chatrow {display:flex;gap:4px;margin-top:2px;width:100%}
#chatInput {flex:1;border-radius:4px;padding:3px 6px;border:1px solid #c6a85e;font-size:10px}

footer {font-size:8px;color:#d4c39c;padding:2px;flex-shrink:0}
.hidden{display:none!important}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header>
 <div class="brand">MONOPOLIGOITA PRESENTA</div>
 <h1>Scopa by Dany</h1>
 <div id="connectionStatus">Connessione in corso...</div>
 <div id="score">Giocatore 1: 0 — Giocatore 2: 0</div>
</header>

<main>
 <section class="panel">
  <div id="opponentLabel" class="label">AVVERSARIO · IN ATTESA...</div>
  <div id="opponent" class="area"></div>
 </section>

 <section class="panel" id="table">
  <div class="label">✦ TAVOLO DA GIOCO ✦</div>
  <div id="remaining">🂠 MAZZO: --</div>
  <div id="middle" class="area"></div>
 </section>

 <section class="panel">
  <div id="myRoleLabel" class="label">LE TUE CARTE</div>
  <div id="player" class="area"></div>
  <button id="play" onclick="playPlayerCard()" disabled>Gioca carta</button>
 </section>

 <div id="message" aria-live="polite"></div>

 <section class="panel" id="chat">
  <div class="label">💬 CHAT DEL TAVOLO</div>
  <div id="chatlog" aria-live="polite">Connesso al tavolo.</div>
  <div class="chatrow">
   <input id="chatInput" maxlength="180" placeholder="Messaggio…">
   <button onclick="sendChat()">Invia</button>
  </div>
 </section>
</main>

<footer>Scopa Napoletana · Monopolygoita</footer>

<script>
const SUPABASE_URL = 'https://sommziqnmxgkwyjatxcn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qkiuSaslucRFunQhtFc48Q_cY8_um9C';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe?.user;
const userId = user ? user.id : Math.floor(Math.random() * 1000000);
const userName = user ? (user.first_name || 'Giocatore') : 'Ospite_' + userId;
const chatId = tg.initDataUnsafe?.chat?.id || 123456789;

let currentGameId = null;
let playerRole = null;
let gameState = {
  board_cards: [],
  player1_hand: [],
  player2_hand: [],
  deck: [],
  turn: null,
  status: 'waiting',
  player1_id: null,
  player1_name: 'In attesa...',
  player2_id: null,
  player2_name: 'In attesa...'
};
let selectedCardId = null;

const suits=["denari","coppe","spade","bastoni"];
const files=[
"01 Asso di denari.jpg","02 Due di denari.jpg",
"03 Tre di denari.jpg","04 Quattro di denari.jpg",
"05 Cinque di denari.jpg","06 Sei di denari.jpg",
"07 Sette di denari.jpg","08 Otto di denari.jpg",
"09 Nove di denari.jpg","10 Dieci di denari.jpg",
"11 Asso di coppe.jpg","12 Due di coppe.jpg",
"13 Tre di coppe.jpg","14 Quattro di coppe.jpg",
"15 Cinque di coppe.jpg","16 Sei di coppe.jpg",
"17 Sette di coppe.jpg","18 Otto di coppe.jpg",
"19 Nove di coppe.jpg","20 Dieci di coppe.jpg",
"21 Asso di spade.jpg","22 Due di spade.jpg",
"23 Tre di spade.jpg","24 Quattro di spade.jpg",
"25 Cinque di spade.jpg","26 Sei di spade.jpg",
"27 Sette di spade.jpg","28 Otto di spade.jpg",
"29 Nove di spade.jpg","30 Dieci di spade.jpg",
"31 Asso di bastoni.jpg","32 Due di bastoni.jpg",
"33 Tre di bastoni.jpg","34 Quattro di bastoni.jpg",
"35 Cinque di bastoni.jpg","36 Sei di bastoni.jpg",
"37 Sette di bastoni.jpg","38 Otto di bastoni.jpg",
"39 Nove di bastoni.jpg","40 Dieci di Bastoni.jpg"
];

function makeDeck(){
 const d=files.map((file,i)=>({
  id:i+1,rank:i%10+1,suit:suits[Math.floor(i/10)],
  file,value:i%10+1
 }));
 for(let i=d.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [d[i],d[j]]=[d[j],d[i]];
 }
 return d;
}

function imageURL(c){
 return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(c.file);
}

async function initMultiplayer() {
  document.getElementById("connectionStatus").textContent = "Ricerca tavolo...";

  let { data: games } = await supabase
    .from('games')
    .select('*')
    .eq('chat_id', chatId)
    .eq('status', 'waiting')
    .limit(1);

  if (games && games.length > 0) {
    const game = games[0];
    if (game.player1_id === userId) {
      currentGameId = game.id;
      playerRole = 'player1';
      document.getElementById("connectionStatus").textContent = "In attesa di avversario...";
    } else {
      currentGameId = game.id;
      playerRole = 'player2';
      
      const deck = makeDeck();
      const board = [deck.pop(), deck.pop(), deck.pop(), deck.pop()];
      const p1Hand = [deck.pop(), deck.pop(), deck.pop()];
      const p2Hand = [deck.pop(), deck.pop(), deck.pop()];

      await supabase.from('games').update({
        player2_id: userId,
        player2_name: userName,
        status: 'playing',
        board_cards: board,
        player1_hand: p1Hand,
        player2_hand: p2Hand,
        deck: deck,
        turn: game.player1_id
      }).eq('id', currentGameId);

      document.getElementById("connectionStatus").textContent = "In gioco con " + game.player1_name;
    }
  } else {
    const { data: newGame } = await supabase.from('games').insert([
      {
        chat_id: chatId,
        player1_id: userId,
        player1_name: userName,
        status: 'waiting',
        board_cards: [],
        player1_hand: [],
        player2_hand: [],
        deck: []
      }
    ]).select().single();

    if(newGame) {
      currentGameId = newGame.id;
      playerRole = 'player1';
      document.getElementById("connectionStatus").textContent = "In attesa di Giocatore 2...";
    }
  }

  subscribeRealtime();
}

function subscribeRealtime() {
  supabase
    .channel('room_' + currentGameId)
    .on('postgres_changes', { 
      event: 'UPDATE', 
      schema: 'public', 
      table: 'games',
      filter: `id=eq.${currentGameId}`
    }, (payload) => {
      gameState = payload.new;
      render();
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        const { data } = await supabase.from('games').select('*').eq('id', currentGameId).single();
        if (data) {
          gameState = data;
          render();
        }
      }
    });
}

function render() {
  const pArea = document.getElementById("player");
  const mArea = document.getElementById("middle");
  const oArea = document.getElementById("opponent");

  pArea.replaceChildren();
  mArea.replaceChildren();
  oArea.replaceChildren();

  const isP1 = playerRole === 'player1';
  document.getElementById("myRoleLabel").textContent = "LE TUE CARTE (" + (isP1 ? gameState.player1_name : gameState.player2_name) + ")";
  document.getElementById("opponentLabel").textContent = "AVVERSARIO · " + (isP1 ? (gameState.player2_name || "In attesa...") : gameState.player1_name);

  const myHand = isP1 ? gameState.player1_hand : gameState.player2_hand;
  if (myHand) {
    myHand.forEach(c => {
      const im = document.createElement("img");
      im.className = "card" + (selectedCardId === c.id ? " selected" : "");
      im.src = imageURL(c);
      im.alt = c.file;
      im.onclick = () => {
        if (gameState.turn === userId && gameState.status === 'playing') {
          selectedCardId = c.id;
          render();
        }
      };
      pArea.appendChild(im);
    });
  }

  const oppHand = isP1 ? gameState.player2_hand : gameState.player1_hand;
  if (oppHand) {
    oppHand.forEach(() => {
      const b = document.createElement("div");
      b.className = "card back";
      oArea.appendChild(b);
    });
  }

  if (gameState.board_cards) {
    gameState.board_cards.forEach(c => {
      const im = document.createElement("img");
      im.className = "card";
      im.src = imageURL(c);
      mArea.appendChild(im);
    });
  }

  if (gameState.deck) {
    document.getElementById("remaining").textContent = "🂠 MAZZO: " + gameState.deck.length;
  }

  const myTurn = (gameState.turn === userId && gameState.status === 'playing');
  document.getElementById("play").disabled = !myTurn || selectedCardId === null;

  if (gameState.status === 'waiting') {
    say("In attesa di un altro giocatore...");
  } else if (myTurn) {
    say("Tocca a te! Scegli una carta e gioca.");
  } else {
    say("Turno dell'avversario...");
  }
}

function say(t) {
  document.getElementById("message").textContent = t;
}

async function playPlayerCard() {
  const isP1 = player
